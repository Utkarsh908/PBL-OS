<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CPU Scheduling Algorithms - Home</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index_styles.css" />
  </head>
  <body>
    <!-- Header and Navigation -->
    <header>
      <nav>
        <div class="logo">CPU Scheduling</div>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="algorithms.html">Algorithms</a></li>
          <li><a href="stimulation.html">Simulation</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <!-- Hero Section with Background Video -->
    <section class="hero">
      <video autoplay muted loop>
        <source
          src="Home_page_vedio/Home_page_BG_vedio.mp4"
          type="video/mp4"
        />
        Your browser does not support the video tag.
      </video>

      <div class="hero-content">
        <div class="text-box">
          <h1><b>Intelligent CPU<br />Scheduler</b></h1>
          <h3>
            <i>Explore Different CPU Scheduling Algorithms <br />
            With <br />
            Real-Time Simulations</i>
          </h3>
        </div>

        <!-- Login Button -->
        <button onclick="toggleLoginForm()">Login</button>
      </div>
    </section>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
      <div class="modal-content">
        <span class="close" onclick="toggleLoginForm()">&times;</span>
        <h2>Login</h2>
        <form onsubmit="handleLogin(event)">
          <input
            type="text"
            id="username"
            placeholder="Username"
            required
          /><br />
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          /><br />
          <button type="submit">Login</button>
          <p id="loginMessage"></p>
        </form>
      </div>
    </div>

    <!-- Script -->
    <script>
      function toggleLoginForm() {
        const modal = document.getElementById("loginModal");
        modal.style.display =
          modal.style.display === "block" ? "none" : "block";
      }

      function handleLogin(event) {
        event.preventDefault();
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        if (username === "admin" && password === "1234") {
          document.getElementById("loginMessage").textContent =
            "Login successful!";
          document.getElementById("loginMessage").style.color = "green";

          setTimeout(() => {
            window.location.href = "algorithms.html";
          }, 1000);
        } else {
          document.getElementById("loginMessage").textContent =
            "Invalid credentials.";
          document.getElementById("loginMessage").style.color = "red";
        }
      }

      window.onclick = function (event) {
        const modal = document.getElementById("loginModal");
        if (event.target === modal) {
          modal.style.display = "none";
        }
      };
    </script>
  </body>
</html>
